<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marchland Saga</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600&display=swap">
<style>
/* Layout: one storybook stage (16:9 SVG) over a caption strip and a control row. Single committed look: dusk-plum frame, cartoon outlines. */
:root{
  --frame:#1d1230; --panel:#2b1b47; --ink:#2a1b3d; --paper:#fff4d6; --gold:#ffcf3f; --hot:#ff5a3c;
  --sky-a:#8fd3ff; --sky-b:#d9f2ff;
  --display:'Bangers','Impact','Arial Narrow',sans-serif;
  --body:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--frame);}
body{margin:0;color:var(--paper);font-family:var(--body);padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
h1{font-family:var(--display);font-weight:400;letter-spacing:.06em;font-size:clamp(26px,5vw,40px);margin:0;color:var(--gold);text-shadow:2px 2px 0 var(--hot);text-wrap:balance;}
.sub{margin:0;font-size:14px;opacity:.85;}
.stagebox{position:relative;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:#000;box-shadow:0 6px 0 #0d0718;}
svg.stage{display:block;width:100%;height:auto;max-width:100%;}
.cap{background:var(--panel);border:3px solid var(--ink);border-radius:10px;padding:12px 14px;min-height:3.6em;font-size:clamp(15px,2.6vw,19px);line-height:1.35;}
.cap b{font-family:var(--display);font-weight:400;letter-spacing:.05em;color:var(--gold);font-size:1.15em;}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.ctl button{font:600 15px var(--body);color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 #0d0718;}
.ctl button:active{transform:translateY(2px);box-shadow:0 1px 0 #0d0718;}
.ctl button:focus-visible{outline:3px solid #fff;outline-offset:2px;}
.dots{display:flex;gap:6px;margin-left:auto;}
.dots i{width:12px;height:12px;border-radius:50%;background:#5a4680;border:2px solid var(--ink);cursor:pointer;display:block;}
.dots i.on{background:var(--gold);}

/* ---- SVG text + common ---- */
.stage text{font-family:var(--display);letter-spacing:.05em;}
.ol{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;}
.scene{display:none;}
.scene.on{display:block;}
.paused *{animation-play-state:paused !important;}

/* ---- keyframes ---- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
@keyframes dropin{0%{opacity:0;transform:translateY(-120px)}70%{opacity:1;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sneak{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes stomp{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(960px)}}
@keyframes flag{0%,100%{transform:skewY(0deg) scaleX(1)}50%{transform:skewY(8deg) scaleX(.9)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@keyframes floatup{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px)}}
@keyframes flex{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg) scale(1.08)}}
@keyframes gallop{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}}
@keyframes gallop2{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}
@keyframes ride{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes capewave{0%,100%{transform:rotate(0) skewX(0)}50%{transform:rotate(-6deg) skewX(-10deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes dust{0%{opacity:.8;transform:scale(.3) translateX(0)}100%{opacity:0;transform:scale(1.6) translateX(-50px)}}
@keyframes arrow{0%{opacity:1;transform:translate(0,0) rotate(18deg)}100%{opacity:1;transform:translate(300px,70px) rotate(35deg)}}
@keyframes bam{0%{opacity:0;transform:scale(0) rotate(-12deg)}25%{opacity:1;transform:scale(1.3) rotate(-6deg)}70%{opacity:1;transform:scale(1) rotate(-6deg)}100%{opacity:0;transform:scale(1.1) rotate(-6deg)}}
@keyframes yeet1{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(380px,-260px) rotate(720deg)}}
@keyframes yeet2{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(300px,-300px) rotate(-640deg)}}
@keyframes flee{0%{transform:translateX(0)}100%{transform:translateX(560px)}}
@keyframes rear{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-16deg)}}
@keyframes swing{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(55deg)}}
@keyframes confetti{0%{opacity:0;transform:translateY(-40px) rotate(0)}15%{opacity:1}100%{opacity:1;transform:translateY(420px) rotate(540deg)}}
@keyframes panelin{0%{opacity:0;transform:translateX(120px)}100%{opacity:1;transform:translateX(0)}}
@keyframes dim{from{opacity:0}to{opacity:.55}}
@keyframes shrink{0%{transform:scale(1)}100%{transform:scale(.55)}}

/* ---- utility classes driven by --d (delay) and --t (duration) ---- */
.scene.on .a-fade{animation:fade .6s both;animation-delay:var(--d,0s)}
.scene.on .a-pop{animation:pop .5s both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.scene.on .a-drop{animation:dropin .8s both;animation-delay:var(--d,0s)}
.scene.on .a-bob{animation:bob 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.scene.on .a-sneak{animation:sneak .55s ease-in-out infinite;animation-delay:var(--d,0s)}
.scene.on .a-stomp{animation:stomp .32s ease-in-out infinite;animation-delay:var(--d,0s)}
.scene.on .a-cloud{animation:drift var(--t,60s) linear infinite;animation-delay:var(--d,0s)}
.scene.on .a-flag{animation:flag 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.scene.on .a-glow{animation:glow 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene.on .a-twinkle{animation:twinkle 1.6s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.scene.on .a-float{animation:floatup 2.6s ease-out infinite;animation-delay:var(--d,0s)}
.scene.on .a-flex{animation:flex 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom}
.scene.on .a-leg1{animation:gallop .38s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
.scene.on .a-leg2{animation:gallop2 .38s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
.scene.on .a-ride{animation:ride .38s ease-in-out infinite}
.scene.on .a-cape{animation:capewave .5s ease-in-out infinite;transform-box:fill-box;transform-origin:right top}
.scene.on .a-shake{animation:shake .18s linear infinite;animation-delay:var(--d,0s)}
.scene.on .a-dust{animation:dust .9s ease-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.scene.on .a-bam{animation:bam 1.6s both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.scene.on .a-rear{animation:rear 1.8s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:bottom center}
.scene.on .a-swing{animation:swing .5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.scene.on .a-confetti{animation:confetti 3.4s linear infinite;animation-delay:var(--d,0s)}
.scene.on .a-panel{animation:panelin .9s ease-out both;animation-delay:var(--d,0s)}
.scene.on .a-dim{animation:dim 1.5s both;animation-delay:var(--d,0s)}
.a-yeet1,.a-yeet2{transform-box:fill-box;transform-origin:center}
.scene.on .a-yeet1{animation:yeet1 1.1s cubic-bezier(.2,.7,.4,1) both;animation-delay:var(--d,0s)}
.scene.on .a-yeet2{animation:yeet2 1.1s cubic-bezier(.2,.7,.4,1) both;animation-delay:var(--d,0s)}
.scene.on .a-flee{animation:flee 3.5s ease-in both;animation-delay:var(--d,0s)}
.scene.on .a-arrow{animation:arrow 1.1s linear infinite;animation-delay:var(--d,0s)}
.scene.on .a-march{animation:marchin var(--t,4s) linear both;animation-delay:var(--d,0s)}
.scene.on .a-gallopin{animation:gallopin var(--t,2s) ease-out both;animation-delay:var(--d,0s)}
@keyframes marchin{from{transform:translateX(var(--from,360px))}to{transform:translateX(0)}}
@keyframes gallopin{from{transform:translateX(-520px)}to{transform:translateX(0)}}

@media (prefers-reduced-motion:reduce){
  .scene.on *{animation:none !important;opacity:1}
}

.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;width:100%;border:0;margin:0;padding:0 0 4%;background:linear-gradient(to top,rgba(29,18,48,.8),rgba(29,18,48,0) 55%);color:var(--gold);font-family:var(--display);font-size:clamp(30px,8vw,60px);letter-spacing:.08em;text-shadow:3px 3px 0 var(--hot);cursor:pointer;z-index:2}
.start small{font-family:var(--body);font-weight:600;font-size:clamp(13px,2.6vw,17px);letter-spacing:.02em;color:var(--paper);text-shadow:none}
.start:focus-visible{outline:4px solid #fff;outline-offset:-8px}
.stage.await *{animation:none !important}
.stage.await .a-float{opacity:0}
</style>
<style>
/* looping animations inside <use> definitions must not depend on .scene.on ancestry */
.a-cape{animation:capewave .5s ease-in-out infinite;transform-box:fill-box;transform-origin:right top}
.a-leg1{animation:gallop .38s ease-in-out infinite;animation-play-state:var(--lp,running);animation-delay:var(--ld0,0s);transform-box:fill-box;transform-origin:top center}
.a-leg2{animation:gallop2 .38s ease-in-out infinite;animation-play-state:var(--lp,running);animation-delay:var(--ld0,0s);transform-box:fill-box;transform-origin:top center}
.a-flex{animation:flex 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom}
.a-glow{animation:glow 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-twinkle{animation:twinkle 1.6s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.a-flag{animation:flag 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.a-swing{animation:swing .5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
</style>
</head>

<script>
(function(){
  var scenes=[
    {id:'s1',dur:8500,cap:'<b>CHAPTER 1: THE REALM.</b> In Marchland every step is a stone and every stride is grain. Lord Bohrer, radiant, handsome and absurdly muscular, rules his land with honor.'},
    {id:'s2',dur:9500,cap:'<b>CHAPTER 2: THE SNEAK.</b> At dusk the goblins creep in: Count Unidos, Pietro, Ant, and their boss, the dreaded Sir Charlton, dragging his October guillotine.'},
    {id:'s3',dur:8000,cap:'<b>CHAPTER 3: THE CHARGE.</b> The goblins storm the border. The watchtower fires. Bohrer calls for his horse and gallops to the frontier.'},
    {id:'s4',dur:10000,cap:'<b>CHAPTER 4: THE DEFENSE.</b> Abs out, sword up. Bohrer sends them flying one by one, and Sir Charlton gets the biggest launch of all.'},
    {id:'s5',dur:9500,cap:'<b>CHAPTER 5: THE LEADERBOARD.</b> Bohrer holds all the ground. The goblins hold a few squares, a ruin, and a lot of bruises.'}
  ];
  var stage=document.getElementById('stage'), capEl=document.getElementById('cap'),
      bPlay=document.getElementById('bPlay'), dotsEl=document.getElementById('dots');
  var reduce=false;
  try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  var cur=0, elapsed=0, playing=false, last=0, awaiting=true;
  var dots=scenes.map(function(s,i){
    var d=document.createElement('i'); d.setAttribute('role','tab'); d.setAttribute('aria-label','Chapter '+(i+1));
    d.tabIndex=0;
    d.addEventListener('click',function(){show(i);});
    d.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i);}});
    dotsEl.appendChild(d); return d;
  });
  function show(i){
    i=(i+scenes.length)%scenes.length;
    scenes.forEach(function(s){document.getElementById(s.id).classList.remove('on');});
    var el=document.getElementById(scenes[i].id);
    el.classList.add('on');
    cur=i; elapsed=0;
    capEl.innerHTML=scenes[i].cap;
    dots.forEach(function(d,k){d.classList.toggle('on',k===i);});
  }

  /* ---------- synthesized score (Web Audio, no files) ---------- */
  var AC=window.AudioContext||window.webkitAudioContext, ctx=null, master=null, noiseBuf=null,
      musicOn=true, nextT=0, step=0, timer=null, EIGHTH=0.29;
  var bMus=document.getElementById('bMus');
  function mf(m){return 440*Math.pow(2,(m-69)/12);}
  var CH={
    minor:[[50,53,57],[46,50,53],[53,57,60],[48,52,55]],
    major:[[50,54,57],[43,47,50],[47,50,54],[45,49,52]]
  };
  var MEL={
    minor:[[74,0,0,0,77,0,76,74],[70,0,0,0,74,0,72,70],[72,0,0,0,77,0,76,77],[79,0,0,0,76,0,74,72]],
    major:[[78,0,0,0,81,0,83,81],[79,0,0,0,83,0,81,79],[78,0,0,0,81,0,83,86],[85,0,0,0,81,0,83,85]]
  };
  function tone(t,midi,dur,type,vol,cut,att,rel,det){
    var o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type=type;o.frequency.value=mf(midi);if(det)o.detune.value=det;
    f.type='lowpass';f.frequency.value=cut;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setTargetAtTime(0,t+dur,rel);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+dur+rel*7);
  }
  function drum(t,vol){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+0.28);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.75);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.8);
    var n=ctx.createBufferSource(),nf=ctx.createBiquadFilter(),ng=ctx.createGain();
    n.buffer=noiseBuf;nf.type='lowpass';nf.frequency.value=380;
    ng.gain.setValueAtTime(vol*0.7,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    n.connect(nf);nf.connect(ng);ng.connect(master);n.start(t);n.stop(t+0.25);
  }
  function crash(t,vol){
    var n=ctx.createBufferSource(),nf=ctx.createBiquadFilter(),ng=ctx.createGain();
    n.buffer=noiseBuf;nf.type='highpass';nf.frequency.value=5200;
    ng.gain.setValueAtTime(vol,t);ng.gain.exponentialRampToValueAtTime(0.001,t+1.8);
    n.connect(nf);nf.connect(ng);ng.connect(master);n.start(t);n.stop(t+1.9);
  }
  function playStep(s,t){
    var sc=cur, key=(sc===0||sc===4)?'major':'minor', bar=Math.floor(s/8)%4, b=s%8, ch=CH[key][bar];
    var padV=[0.035,0.05,0.055,0.065,0.055][sc];
    if(b===0){
      ch.forEach(function(n){
        tone(t,n,EIGHTH*8,'sawtooth',padV,650,0.6,0.5,-7);
        tone(t,n,EIGHTH*8,'sawtooth',padV,650,0.6,0.5,7);
      });
      tone(t,ch[0]-12,EIGHTH*8,'sine',0.16,300,0.1,0.4);
    }
    if(sc===0&&b%2===0) tone(t,ch[(b/2)%3]+12,EIGHTH*1.6,'triangle',0.05,2600,0.01,0.25);
    if(sc>=2){
      var idx=[0,1,2,1,0,1,2,1][b], av=[0,0,0.035,0.045,0.025][sc];
      tone(t,ch[idx]+12,EIGHTH*0.9,'sawtooth',av,1900,0.01,0.08);
    }
    if(sc>=2||sc===0){
      var m=MEL[key][bar][b];
      if(m){
        var mv=[0.05,0,0.075,0.085,0.08][sc];
        tone(t,m,EIGHTH*(b===0?3.6:2.4),'sawtooth',mv,sc===0?1500:2100,0.05,0.18,-5);
        tone(t,m,EIGHTH*(b===0?3.6:2.4),'sawtooth',mv,sc===0?1500:2100,0.05,0.18,5);
        if(sc>=3) tone(t,m-12,EIGHTH*2.4,'square',0.02,1100,0.05,0.18);
      }
    }
    if(sc===1){ if(b===0)drum(t,0.5); if(b===4)drum(t,0.28); if(b===6&&bar%2===1)drum(t,0.2); }
    else if(sc===2){ if(b===0||b===4)drum(t,0.55); if(b===2||b===6)drum(t,0.32); if(b===0&&bar===0)crash(t,0.12); }
    else if(sc===3){ if(b%2===0)drum(t,b===0||b===4?0.65:0.45); if(b===5||b===7)drum(t,0.28); if(b===0)crash(t,bar===0?0.2:0.1); }
    else if(sc===4){ if(b===0)drum(t,0.55); if(b===4)drum(t,0.45); if(b===0&&bar===0)crash(t,0.16); }
  }
  function pump(){
    if(!musicOn||!ctx)return;
    while(nextT<ctx.currentTime+0.3){playStep(step,nextT);nextT+=EIGHTH;step++;}
  }
  var unlockEl=null, SILENT='data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
  function unlockAudio(){
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    try{
      if(!unlockEl){unlockEl=new Audio();unlockEl.src=SILENT;unlockEl.loop=true;unlockEl.setAttribute('playsinline','');}
      var pr=unlockEl.play();if(pr&&pr.catch)pr.catch(function(){});
    }catch(e){}
  }
  function startMusic(){
    if(!AC)return false;
    try{
      unlockAudio();
      if(!ctx){
        ctx=new AC();
        var comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=5;
        master=ctx.createGain();master.gain.value=1.1;master.connect(comp);comp.connect(ctx.destination);
        noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
        var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      }
      ctx.resume();
      musicOn=true;nextT=ctx.currentTime+0.1;step=0;
      if(!timer)timer=setInterval(pump,60);
      if(!playing)ctx.suspend();
      return true;
    }catch(e){return false;}
  }
  function stopMusic(){
    musicOn=false;
    try{if(unlockEl)unlockEl.pause();}catch(e){}
    if(ctx){try{ctx.suspend();}catch(e){}}
  }
  function setMusLabel(){
    bMus.textContent=musicOn?'Music: On':'Music: Off';
    bMus.setAttribute('aria-pressed',musicOn?'true':'false');
  }
  bMus.addEventListener('click',function(){
    if(musicOn){stopMusic();}
    else if(awaiting){musicOn=true;}
    else if(!startMusic()){bMus.textContent='Music unavailable';return;}
    setMusLabel();
  });
  function setPlaying(p){
    playing=p;
    if(ctx&&musicOn){try{p?ctx.resume():ctx.suspend();}catch(e){}}
    stage.classList.toggle('paused',!p);
    bPlay.textContent=p?'Pause':'Play';
  }
  function tick(t){
    var dt=last?Math.min(t-last,100):0; last=t;
    if(playing){
      elapsed+=dt;
      if(elapsed>=scenes[cur].dur) show(cur+1);
    }
    requestAnimationFrame(tick);
  }
  document.getElementById('bPrev').addEventListener('click',function(){show(cur-1);});
  document.getElementById('bNext').addEventListener('click',function(){show(cur+1);});
  document.getElementById('bRe').addEventListener('click',function(){if(awaiting){show(0);begin();return;}show(0);if(!playing)setPlaying(true);});
  bPlay.addEventListener('click',function(){if(awaiting){begin();return;}setPlaying(!playing);});
  show(0); setPlaying(playing);
  var startBtn=document.getElementById('start');
  stage.classList.add('await'); setMusLabel();
  function begin(){
    if(!awaiting)return;
    awaiting=false; startBtn.hidden=true; stage.classList.remove('await');
    show(cur); setPlaying(true);
    if(musicOn)startMusic();
  }
  startBtn.addEventListener('click',begin);
  requestAnimationFrame(tick);
})();
</script>

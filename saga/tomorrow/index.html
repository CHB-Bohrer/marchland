<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marchland Saga: The Plague Comes Tomorrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#040506;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:min(100vw,177.78vh);height:min(56.25vw,100vh);position:relative;background:#000;overflow:hidden;container-type:inline-size}
#stage svg,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(60,14,10,.8),rgba(3,2,2,.97));color:#e8d6b0;cursor:pointer;text-align:center;z-index:5;font-family:'Cinzel',serif}
#start h1{font-size:6cqw;letter-spacing:.14em;margin:0 0 .2em;font-weight:800;text-shadow:0 0 30px rgba(255,80,40,.4)}
#start h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.6cqw;color:#9fe08a;margin:0 0 1.4em;font-weight:600}
#start p{font-size:1.5cqw;opacity:.75;margin:0;letter-spacing:.2em}
#sub{position:absolute;left:0;right:0;bottom:7%;text-align:center;z-index:3;pointer-events:none;font-family:'Cormorant Garamond',serif;font-size:2.6cqw;color:#f1e8cf;text-shadow:0 2px 6px #000,0 0 14px #000;transition:opacity .25s;opacity:0;padding:0 10%}
#sub b{font-family:'Cinzel',serif;font-size:.72em;letter-spacing:.12em;color:#d6b36a;margin-right:.5em;font-weight:600}
#sub i{color:#e9b09a}
#sub.top{bottom:auto;top:9%}
#sub.god{color:#ffcf8a;font-family:'Cinzel',serif;font-size:2.3cqw;letter-spacing:.08em;text-shadow:0 0 18px #ff4a10,0 2px 6px #000}
.tag{position:absolute;z-index:3;pointer-events:none;font-family:'Cinzel',serif;color:#f3e6bf;opacity:0;transition:opacity .5s,transform .5s;transform:translateY(8px)}
.tag .n{font-size:2.4cqw;font-weight:800;letter-spacing:.18em;text-shadow:0 2px 8px #000}
.tag .r{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.4cqw;color:#cdb98a;text-shadow:0 2px 6px #000}
.tag .bar{height:2px;width:100%;background:linear-gradient(90deg,#c9a14e,transparent);margin:.2em 0}
.tag.on{opacity:1;transform:none}
#ctl{position:absolute;right:1%;top:1.5%;z-index:6;display:flex;gap:8px}
#ctl button,#ctl a{background:rgba(0,0,0,.5);color:#cdbf99;border:1px solid #5a5238;border-radius:6px;padding:4px 10px;font:600 13px 'Cinzel',serif;cursor:pointer;text-decoration:none}
</style></head><body>
<div id="wrap"><div id="stage">
<svg id="svg" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="b24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb24a" stop-opacity=".9"/><stop offset=".45" stop-color="#ff8a2a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9dffb0" stop-opacity=".75"/><stop offset=".4" stop-color="#3ad07a" stop-opacity=".3"/><stop offset="1" stop-color="#1a8a4a" stop-opacity="0"/></radialGradient>
<radialGradient id="fire" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd07a" stop-opacity=".9"/><stop offset=".5" stop-color="#ff5a1a" stop-opacity=".45"/><stop offset="1" stop-color="#8a1000" stop-opacity="0"/></radialGradient>
<radialGradient id="sheen" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<g id="cam">
  <g id="map"></g>
  <g id="den" style="display:none"></g>
  <g id="sick" style="display:none"></g>
  <g id="church" style="display:none"></g>
  <g id="plea" style="display:none"></g>
</g>
</svg>
<canvas id="fx" width="1920" height="1080"></canvas>
<svg id="over" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" style="pointer-events:none">
<defs>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .7  0 0 0 0 .66  0 0 0 0 .55  0 0 0 .12 0"/></filter>
<filter id="ob10"><feGaussianBlur stdDeviation="10"/></filter>
<radialGradient id="vig" cx=".5" cy=".48" r=".72"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
</defs>
<rect id="flash" width="1280" height="720" fill="#eef2ff" opacity="0"/>
<rect width="1280" height="720" fill="url(#vig)"/>
<rect width="1280" height="720" filter="url(#grain)"/>
<g id="bars"><rect width="1280" height="56" fill="#000"/><rect y="664" width="1280" height="56" fill="#000"/></g>
<rect id="fade" width="1280" height="720" fill="#000" opacity="1"/>
<g id="title" opacity="0" text-anchor="middle">
  <rect x="0" y="250" width="1280" height="200" fill="#000" opacity=".55" filter="url(#ob10)"/>
  <text x="640" y="345" font-size="92" letter-spacing="16" fill="#e8dcb4" font-family="Cinzel,serif" font-weight="800">MARCHLAND</text>
  <text x="640" y="402" font-size="34" letter-spacing="4" fill="#9fe08a" font-family="Cormorant Garamond,serif" font-style="italic" font-weight="600">The Plague Comes Tomorrow</text>
</g>
</svg>
<div id="sub"></div>
<div id="start"><h1>MARCHLAND SAGA</h1><h2>The Plague Comes Tomorrow</h2><p>TAP TO BEGIN &middot; SOUND ON</p></div>
<div id="ctl"><button id="mute">Sound: on</button><button id="rep">Replay</button><a href="../../">Back to the game</a></div>
</div></div>
<script src="art.js"></script>
<script src="char.js"></script>
<script src="scenes.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>
</body></html>
